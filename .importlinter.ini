# import-linter configuration (Python Architecture-Contract Gate).
# Docs: https://import-linter.readthedocs.io/
#
# The arch_contract_python.py gate runs `lint-imports --config .importlinter.ini`.
# Lower layers must not import higher layers.
#
# Project layering (design-storage-edition-refactor.md §9):
#   aliyun_client (API I/O) -> models (pure data) -> strategy (pure decisions,
#   no I/O) -> executor (orchestration) -> main (entrypoint).

[importlinter]
root_package = polardb_storage_resizer

[importlinter:contract:layers]
name = Layered architecture (main > executor > strategy > models)
type = layers
layers =
    polardb_storage_resizer.main
    polardb_storage_resizer.executor
    polardb_storage_resizer.strategy
    polardb_storage_resizer.models

[importlinter:contract:strategy-no-io]
name = Strategy layer must not import cloud clients (pure decisions, no I/O)
type = forbidden
source_modules =
    polardb_storage_resizer.strategy
forbidden_modules =
    polardb_storage_resizer.aliyun_client
    polardb_storage_resizer.cloud_client

[importlinter:contract:models-pure]
name = Models layer is a pure data carrier (imports nothing above it)
type = forbidden
source_modules =
    polardb_storage_resizer.models
forbidden_modules =
    polardb_storage_resizer.main
    polardb_storage_resizer.executor
    polardb_storage_resizer.strategy
    polardb_storage_resizer.aliyun_client
    polardb_storage_resizer.cloud_client
    polardb_storage_resizer.config
